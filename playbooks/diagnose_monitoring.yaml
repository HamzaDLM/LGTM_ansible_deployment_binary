---
- name: Diagnose monitoring services
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: false
  vars_files:
    - "../vars/common_{{ env | default('dev') }}.yaml"
  vars:
    monitoring_log_lines: "{{ log_lines | default(120) }}"
    monitoring_log_services: "{{ services | default(['grafana', 'loki', 'tempo', 'prometheus', 'alloy', 'nginx']) }}"

  tasks:
    - name: Collect service status
      ansible.builtin.command:
        argv:
          - systemctl
          - status
          - "{{ item }}.service"
          - --no-pager
      loop: "{{ monitoring_log_services }}"
      register: monitoring_service_status
      changed_when: false
      failed_when: false

    - name: Print service status
      ansible.builtin.debug:
        msg: |
          ===== systemctl status {{ item.item }}.service =====
          rc={{ item.rc }}
          {{ item.stdout | default('') }}
          {{ item.stderr | default('') }}
      loop: "{{ monitoring_service_status.results }}"

    - name: Collect recent service logs
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - "{{ item }}.service"
          - -n
          - "{{ monitoring_log_lines | string }}"
          - --no-pager
          - --output
          - short-iso
      loop: "{{ monitoring_log_services }}"
      register: monitoring_service_logs
      changed_when: false
      failed_when: false

    - name: Print recent service logs
      ansible.builtin.debug:
        msg: |
          ===== journalctl -u {{ item.item }}.service -n {{ monitoring_log_lines }} =====
          rc={{ item.rc }}
          {{ item.stdout | default('') }}
          {{ item.stderr | default('') }}
      loop: "{{ monitoring_service_logs.results }}"

    - name: Collect listening ports
      ansible.builtin.command:
        argv:
          - ss
          - -lntp
      register: monitoring_listening_ports
      changed_when: false
      failed_when: false

    - name: Print relevant listening ports
      ansible.builtin.debug:
        msg: |
          ===== ss -lntp relevant ports =====
          {{ monitoring_listening_ports.stdout_lines
             | default([])
             | select('search', ':(3000|3100|3200|4317|4318|9090|9096|9097|12345|443)\\b')
             | list
             | join('\n') }}
          {{ monitoring_listening_ports.stderr | default('') }}

    - name: Collect Alloy metrics
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ alloy_http_listen_port | default(12345) }}/metrics"
        return_content: true
      register: monitoring_alloy_metrics
      failed_when: false
      when: "'alloy' in monitoring_log_services"

    - name: Print Alloy Loki pipeline metrics
      ansible.builtin.debug:
        msg: |
          ===== Alloy Loki metrics =====
          {{ monitoring_alloy_metrics.content
             | default('')
             | split('\n')
             | select('match', '^(loki_source|loki_write)')
             | list
             | join('\n') }}
      when: "'alloy' in monitoring_log_services"

    - name: Check Alloy Nginx log files
      ansible.builtin.shell: "ls -l {{ alloy_nginx_log_path | default('/var/log/nginx/*.log') }}"
      register: monitoring_alloy_nginx_logs
      changed_when: false
      failed_when: false
      when: "'alloy' in monitoring_log_services"

    - name: Print Alloy Nginx log files
      ansible.builtin.debug:
        msg: |
          ===== Alloy Nginx source files: {{ alloy_nginx_log_path | default('/var/log/nginx/*.log') }} =====
          rc={{ monitoring_alloy_nginx_logs.rc }}
          {{ monitoring_alloy_nginx_logs.stdout | default('') }}
          {{ monitoring_alloy_nginx_logs.stderr | default('') }}
      when: "'alloy' in monitoring_log_services"

    - name: Check Alloy app log files
      ansible.builtin.shell: "ls -l {{ alloy_app_log_path | default('/var/log/projectsnamex/*.log') }}"
      register: monitoring_alloy_app_logs
      changed_when: false
      failed_when: false
      when: "'alloy' in monitoring_log_services"

    - name: Print Alloy app log files
      ansible.builtin.debug:
        msg: |
          ===== Alloy app source files: {{ alloy_app_log_path | default('/var/log/projectsnamex/*.log') }} =====
          rc={{ monitoring_alloy_app_logs.rc }}
          {{ monitoring_alloy_app_logs.stdout | default('') }}
          {{ monitoring_alloy_app_logs.stderr | default('') }}
      when: "'alloy' in monitoring_log_services"
