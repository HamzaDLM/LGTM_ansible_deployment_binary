---
- name: Diagnose monitoring services
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: false
  vars_files:
    - "../vars/alloy_defaults.yaml"
    - "../vars/common_{{ env | default('dev') }}.yaml"
  vars:
    monitoring_log_lines: "{{ log_lines | default(120) }}"
    monitoring_log_services: "{{ services | default(['grafana', 'loki', 'tempo', 'prometheus', 'alloy', 'nginx']) }}"
    monitoring_alloy_enabled_integrations: "{{ alloy_enabled_integrations | default(alloy_default_enabled_integrations) }}"
    monitoring_alloy_log_sources:
      - name: nginx access
        integration: nginx
        path: "{{ (alloy_nginx | default({})).access_log | default('') }}"
      - name: nginx error
        integration: nginx
        path: "{{ (alloy_nginx | default({})).error_log | default('') }}"
      - name: apache access
        integration: apache
        path: "{{ (alloy_apache | default({})).access_log | default('') }}"
      - name: apache error
        integration: apache
        path: "{{ (alloy_apache | default({})).error_log | default('') }}"
      - name: uvicorn
        integration: uvicorn
        path: "{{ (alloy_uvicorn | default({})).log_path | default('') }}"

  tasks:
    - name: Collect service status
      ansible.builtin.command:
        argv:
          - systemctl
          - status
          - "{{ item }}.service"
          - --no-pager
      loop: "{{ monitoring_log_services }}"
      register: monitoring_service_status
      changed_when: false
      failed_when: false

    - name: Print service status
      ansible.builtin.debug:
        msg: |
          ===== systemctl status {{ item.item }}.service =====
          rc={{ item.rc }}
          {{ item.stdout | default('') }}
          {{ item.stderr | default('') }}
      loop: "{{ monitoring_service_status.results }}"

    - name: Collect recent service logs
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - "{{ item }}.service"
          - -n
          - "{{ monitoring_log_lines | string }}"
          - --no-pager
          - --output
          - short-iso
      loop: "{{ monitoring_log_services }}"
      register: monitoring_service_logs
      changed_when: false
      failed_when: false

    - name: Print recent service logs
      ansible.builtin.debug:
        msg: |
          ===== journalctl -u {{ item.item }}.service -n {{ monitoring_log_lines }} =====
          rc={{ item.rc }}
          {{ item.stdout | default('') }}
          {{ item.stderr | default('') }}
      loop: "{{ monitoring_service_logs.results }}"

    - name: Collect listening ports
      ansible.builtin.command:
        argv:
          - ss
          - -lntp
      register: monitoring_listening_ports
      changed_when: false
      failed_when: false

    - name: Print relevant listening ports
      ansible.builtin.debug:
        msg: |
          ===== ss -lntp relevant ports =====
          {{ monitoring_listening_ports.stdout_lines
             | default([])
             | select('search', ':(3000|3100|3200|4317|4318|9090|9096|9097|12345|443)\\b')
             | list
             | join('\n') }}
          {{ monitoring_listening_ports.stderr | default('') }}

    - name: Collect Alloy metrics
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ alloy_http_listen_port | default(12345) }}/metrics"
        return_content: true
      register: monitoring_alloy_metrics
      failed_when: false
      when: "'alloy' in monitoring_log_services"

    - name: Print Alloy Loki pipeline metrics
      ansible.builtin.debug:
        msg: |
          ===== Alloy Loki metrics =====
          {{ monitoring_alloy_metrics.content
             | default('')
             | split('\n')
             | select('match', '^(loki_source|loki_write)')
             | list
             | join('\n') }}
      when: "'alloy' in monitoring_log_services"

    - name: Check configured Alloy log files
      ansible.builtin.shell: "ls -l {{ item.path }}"
      loop: "{{ monitoring_alloy_log_sources }}"
      register: monitoring_alloy_log_files
      changed_when: false
      failed_when: false
      when:
        - "'alloy' in monitoring_log_services"
        - item.integration in monitoring_alloy_enabled_integrations
        - item.path | length > 0

    - name: Print configured Alloy log files
      ansible.builtin.debug:
        msg: |
          ===== Alloy {{ item.item.name }} source files: {{ item.item.path }} =====
          rc={{ item.rc }}
          {{ item.stdout | default('') }}
          {{ item.stderr | default('') }}
      loop: "{{ monitoring_alloy_log_files.results | default([]) }}"
      when:
        - "'alloy' in monitoring_log_services"
        - item.skipped is not defined or not item.skipped
