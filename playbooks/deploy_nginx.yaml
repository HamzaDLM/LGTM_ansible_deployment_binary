---
- name: Deploy monitoring Nginx gateway
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  vars_files:
    - "../vars/common_{{ env | default('dev') }}.yaml"
  vars:
    nginx_gateway_enabled: "{{ (monitoring_components_enabled | default({})).nginx | default(true) | bool }}"

  tasks:
    - name: Install Nginx
      ansible.builtin.package:
        name: nginx
        state: present
      when: nginx_gateway_enabled | bool

    - name: Create Nginx TLS directory
      ansible.builtin.file:
        path: "{{ nginx_tls_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - nginx_gateway_enabled | bool
        - monitoring_gateway_tls_enabled | bool

    - name: Generate self-signed gateway certificate
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -nodes
          - -newkey
          - rsa:2048
          - -keyout
          - "{{ nginx_ssl_certificate_key }}"
          - -out
          - "{{ nginx_ssl_certificate }}"
          - -days
          - "{{ nginx_self_signed_cert_days | string }}"
          - -subj
          - "/CN={{ monitoring_gateway_server_name }}"
      args:
        creates: "{{ nginx_ssl_certificate }}"
      when:
        - nginx_gateway_enabled | bool
        - monitoring_gateway_tls_enabled | bool
        - nginx_generate_self_signed_cert | bool
      notify: Reload Nginx

    - name: Set gateway certificate permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ nginx_ssl_certificate }}"
          mode: "0644"
        - path: "{{ nginx_ssl_certificate_key }}"
          mode: "0600"
      when:
        - nginx_gateway_enabled | bool
        - monitoring_gateway_tls_enabled | bool
        - nginx_generate_self_signed_cert | bool

    - name: Check gateway TLS files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ nginx_ssl_certificate }}"
        - "{{ nginx_ssl_certificate_key }}"
      register: nginx_gateway_tls_files
      when:
        - nginx_gateway_enabled | bool
        - monitoring_gateway_tls_enabled | bool

    - name: Require gateway TLS files
      ansible.builtin.assert:
        that:
          - nginx_gateway_tls_files.results | map(attribute='stat.exists') | min
        fail_msg: >-
          Nginx TLS is enabled, but {{ nginx_ssl_certificate }} and/or
          {{ nginx_ssl_certificate_key }} is missing. Provide these files or set
          nginx_generate_self_signed_cert: true for non-production environments.
      when:
        - nginx_gateway_enabled | bool
        - monitoring_gateway_tls_enabled | bool

    - name: Install monitoring gateway config
      ansible.builtin.copy:
        dest: "{{ nginx_config_dir }}/monitoring-gateway.conf"
        owner: root
        group: root
        mode: "0644"
        content: |
          upstream monitoring_loki {
            server {{ nginx_loki_upstream }};
            keepalive 16;
          }

          upstream monitoring_prometheus {
            server {{ nginx_prometheus_upstream }};
            keepalive 16;
          }

          upstream monitoring_tempo_grpc {
            server {{ nginx_tempo_grpc_upstream }};
          }

          server {
          {% if monitoring_gateway_tls_enabled | bool %}
            listen {{ monitoring_gateway_listen_port }} ssl http2;
            ssl_certificate {{ nginx_ssl_certificate }};
            ssl_certificate_key {{ nginx_ssl_certificate_key }};
            ssl_protocols TLSv1.2 TLSv1.3;
          {% else %}
            listen {{ monitoring_gateway_listen_port }} http2;
          {% endif %}
            server_name {{ monitoring_gateway_server_name }};

            access_log /var/log/nginx/monitoring-gateway.access.log;
            error_log /var/log/nginx/monitoring-gateway.error.log warn;

            client_max_body_size {{ nginx_client_max_body_size }};

            location = /healthz {
              add_header Content-Type text/plain;
              return 200 "ok\n";
            }

            location /loki/ {
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_pass http://monitoring_loki;
            }

            location /prometheus/ {
              rewrite ^/prometheus/(.*)$ /$1 break;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_pass http://monitoring_prometheus;
            }

            location = /opentelemetry.proto.collector.trace.v1.TraceService/Export {
              grpc_read_timeout 300s;
              grpc_send_timeout 300s;
              grpc_set_header Host $host;
              grpc_set_header X-Real-IP $remote_addr;
              grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              grpc_set_header X-Forwarded-Proto $scheme;
              grpc_pass grpc://monitoring_tempo_grpc;
            }
          }
      when: nginx_gateway_enabled | bool
      notify: Reload Nginx

    - name: Validate Nginx config
      ansible.builtin.command: nginx -t
      changed_when: false
      when: nginx_gateway_enabled | bool

    - name: Enable and start Nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started
        daemon_reload: true
      when: nginx_gateway_enabled | bool

  handlers:
    - name: Reload Nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      when: nginx_gateway_enabled | bool
