---
- name: Deploy monitoring Nginx gateway
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  vars_files:
    - "../vars/common_{{ env | default('dev') }}.yaml"
  vars:
    nginx_gateway_enabled: "{{ (monitoring_components_enabled | default({})).nginx | default(true) | bool }}"

  tasks:
    - name: Install Nginx
      ansible.builtin.package:
        name: nginx
        state: present
      when: nginx_gateway_enabled | bool

    - name: Create Nginx TLS directory
      ansible.builtin.file:
        path: "{{ nginx_tls_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - nginx_gateway_enabled | bool
        - monitoring_gateway_tls_enabled | bool

    - name: Generate self-signed gateway certificate
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -nodes
          - -newkey
          - rsa:2048
          - -keyout
          - "{{ nginx_ssl_certificate_key }}"
          - -out
          - "{{ nginx_ssl_certificate }}"
          - -days
          - "{{ nginx_self_signed_cert_days | string }}"
          - -subj
          - "/CN={{ monitoring_gateway_server_name }}"
          - -addext
          - "subjectAltName=DNS:{{ monitoring_gateway_server_name }}"
      args:
        creates: "{{ nginx_ssl_certificate }}"
      when:
        - nginx_gateway_enabled | bool
        - monitoring_gateway_tls_enabled | bool
        - nginx_generate_self_signed_cert | bool
      notify: Reload Nginx

    - name: Set gateway certificate permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ nginx_ssl_certificate }}"
          mode: "0644"
        - path: "{{ nginx_ssl_certificate_key }}"
          mode: "0600"
      when:
        - nginx_gateway_enabled | bool
        - monitoring_gateway_tls_enabled | bool
        - nginx_generate_self_signed_cert | bool

    - name: Check gateway TLS files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ nginx_ssl_certificate }}"
        - "{{ nginx_ssl_certificate_key }}"
      register: nginx_gateway_tls_files
      when:
        - nginx_gateway_enabled | bool
        - monitoring_gateway_tls_enabled | bool

    - name: Require gateway TLS files
      ansible.builtin.assert:
        that:
          - nginx_gateway_tls_files.results | map(attribute='stat.exists') | min
        fail_msg: >-
          Nginx TLS is enabled, but {{ nginx_ssl_certificate }} and/or
          {{ nginx_ssl_certificate_key }} is missing. Provide these files or set
          nginx_generate_self_signed_cert: true for non-production environments.
      when:
        - nginx_gateway_enabled | bool
        - monitoring_gateway_tls_enabled | bool

    - name: Install monitoring gateway config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../configs/monitoring-gateway.conf.j2"
        dest: "{{ nginx_config_dir }}/monitoring-gateway.conf"
        owner: root
        group: root
        mode: "0644"
      when: nginx_gateway_enabled | bool
      notify: Reload Nginx

    - name: Validate Nginx config
      ansible.builtin.command: nginx -t
      changed_when: false
      when: nginx_gateway_enabled | bool

    - name: Enable and start Nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started
        daemon_reload: true
      when: nginx_gateway_enabled | bool

  handlers:
    - name: Reload Nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      when: nginx_gateway_enabled | bool
