---
- name: Deploy observability agents
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  vars_files:
    - "../vars/alloy_defaults.yaml"
    - "../vars/common_{{ env | default('dev') }}.yaml"
  vars:
    alloy_effective_enabled_integrations: "{{ alloy_enabled_integrations | default(alloy_default_enabled_integrations) }}"
    alloy_unknown_integrations: "{{ alloy_effective_enabled_integrations | difference(alloy_supported_integrations) }}"
    alloy_enabled_validation_specs: >-
      {{
        alloy_integration_required_options
        | dict2items
        | selectattr('key', 'in', alloy_effective_enabled_integrations)
        | list
      }}
    alloy_default_log_reader_groups: "{{ ['adm', 'systemd-journal'] if ansible_os_family == 'Debian' else ['systemd-journal'] }}"
    alloy_effective_log_reader_groups: "{{ alloy_log_reader_groups | default(alloy_default_log_reader_groups) }}"
    agent_artifact_file: "{{ monitoring_component_files.alloy[ansible_os_family] if monitoring_component_files.alloy is mapping else monitoring_component_files.alloy }}"
    agent_components:
      - name: alloy
        enabled: "{{ (monitoring_components_enabled | default({})).alloy | default(true) | bool }}"
        description: Grafana Alloy
        artifact_file: "{{ agent_artifact_file }}"
        binary_dest: alloy
        binary_exec_path: "{{ agent_install_dir }}/bin/alloy"
        package_exec_path: /usr/bin/alloy
        config_file: config.alloy
        config_template: alloy/templates/config.alloy.j2
        data_dir: "{{ agent_data_dir }}/alloy"
        service_args: >-
          run
          --server.http.listen-addr={{ alloy_http_listen_address }}:{{ alloy_http_listen_port }}
          --storage.path={{ agent_data_dir }}/alloy
          {{ agent_config_dir }}/config.alloy

  tasks:
    - name: Validate agent host operating system
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian' or (ansible_os_family == 'RedHat' and (ansible_distribution_major_version | int) >= 8)
        fail_msg: >-
          Unsupported operating system '{{ ansible_distribution }}
          {{ ansible_distribution_version }}' on {{ inventory_hostname }}.
          Supported platforms are Debian-family systems and RHEL-family version
          8 or newer.

    - name: Validate agent artifact package formats
      ansible.builtin.assert:
        that:
          - not (item.artifact_file | lower | regex_search('\\.deb$')) or ansible_os_family == 'Debian'
          - not (item.artifact_file | lower | regex_search('\\.rpm$')) or ansible_os_family == 'RedHat'
        fail_msg: >-
          Artifact '{{ item.artifact_file }}' for {{ item.name }} is incompatible
          with {{ ansible_os_family }} on {{ inventory_hostname }}. Use .deb on
          Debian, .rpm on RedHat, or a raw binary on either platform.
      loop: "{{ agent_components }}"
      when: item.enabled | bool

    - name: Validate Alloy enabled integrations list
      ansible.builtin.assert:
        that:
          - alloy_effective_enabled_integrations is not string
          - alloy_effective_enabled_integrations is sequence
          - alloy_effective_enabled_integrations | length > 0
          - alloy_effective_enabled_integrations | length == alloy_effective_enabled_integrations | unique | length
        fail_msg: >-
          alloy_enabled_integrations must be a non-empty list without duplicate
          values for host {{ inventory_hostname }}.
      when: (monitoring_components_enabled | default({})).alloy | default(true) | bool

    - name: Validate Alloy enabled integrations are supported
      ansible.builtin.assert:
        that:
          - alloy_unknown_integrations | length == 0
        fail_msg: >-
          Unsupported Alloy integration(s) for host {{ inventory_hostname }}:
          {{ alloy_unknown_integrations | join(', ') }}. Supported integrations:
          {{ alloy_supported_integrations | join(', ') }}.
      when: (monitoring_components_enabled | default({})).alloy | default(true) | bool

    - name: Check enabled Alloy integration templates exist
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../configs/alloy/templates/integrations/{{ item }}.alloy.j2"
      delegate_to: localhost
      become: false
      loop: "{{ alloy_effective_enabled_integrations }}"
      register: alloy_integration_template_files
      when: (monitoring_components_enabled | default({})).alloy | default(true) | bool

    - name: Validate enabled Alloy integration templates exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          Alloy integration '{{ item.item }}' is enabled for host
          {{ inventory_hostname }}, but configs/alloy/templates/integrations/{{ item.item }}.alloy.j2
          does not exist in the Ansible project.
      loop: "{{ alloy_integration_template_files.results }}"
      when: (monitoring_components_enabled | default({})).alloy | default(true) | bool

    - name: Validate required Alloy integration options
      ansible.builtin.assert:
        that:
          - alloy_required_option_value | length > 0
          - item.1.pattern is not defined or alloy_required_option_value | regex_search(item.1.pattern)
        fail_msg: >-
          Alloy integration '{{ item.0.key }}' requires
          '{{ item.0.value.config_var }}.{{ item.1.name }}' to be defined{% if item.1.pattern is defined %}
          and match '{{ item.1.pattern }}'{% endif %} for host {{ inventory_hostname }}.
      vars:
        alloy_required_option_value: "{{ (vars[item.0.value.config_var] | default({})).get(item.1.name, '') | string }}"
      loop: "{{ query('ansible.builtin.subelements', alloy_enabled_validation_specs, 'value.required_options', {'skip_missing': true}) }}"
      when: (monitoring_components_enabled | default({})).alloy | default(true) | bool

    - name: Ensure observability group exists
      ansible.builtin.group:
        name: "{{ observability_group }}"
        system: true

    - name: Ensure observability user exists
      ansible.builtin.user:
        name: "{{ observability_user }}"
        group: "{{ observability_group }}"
        create_home: false
        shell: /usr/sbin/nologin
        system: true

    - name: Allow observability user to read service logs
      ansible.builtin.user:
        name: "{{ observability_user }}"
        groups: "{{ alloy_effective_log_reader_groups }}"
        append: true
      notify: Restart agent services

    - name: Allow selected users to read Alloy journal
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../configs/alloy-journal-readers.j2"
        dest: /etc/sudoers.d/alloy-journal-readers
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      when: (alloy_journal_reader_users | default([])) | length > 0

    - name: Create agent base directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ observability_user }}"
        group: "{{ observability_group }}"
        mode: "0755"
      loop:
        - "{{ agent_install_dir }}"
        - "{{ agent_install_dir }}/bin"
        - "{{ agent_config_dir }}"
        - "{{ agent_data_dir }}"

    - name: Create agent data directories
      ansible.builtin.file:
        path: "{{ item.data_dir }}"
        state: directory
        owner: "{{ observability_user }}"
        group: "{{ observability_group }}"
        mode: "0755"
      loop: "{{ agent_components }}"
      when: item.enabled | bool

    - name: Create agent package cache directory
      ansible.builtin.file:
        path: /tmp/monitoring-packages
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install agent binary artifacts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/bin/{{ item.artifact_file }}"
        dest: "{{ agent_install_dir }}/bin/{{ item.binary_dest }}"
        owner: root
        group: root
        mode: "0755"
      loop: "{{ agent_components }}"
      when:
        - item.enabled | bool
        - not (item.artifact_file | lower | regex_search('\\.(deb|rpm)$'))
      notify: Restart agent services

    - name: Stage agent package artifacts
      ansible.builtin.copy:
        src: >-
          {{ playbook_dir }}/../files/{{ 'deb' if (item.artifact_file | lower | regex_search('\.deb$')) else 'rpm' }}/{{ item.artifact_file }}
        dest: "/tmp/monitoring-packages/{{ item.artifact_file }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ agent_components }}"
      when:
        - item.enabled | bool
        - item.artifact_file | lower | regex_search('\\.(deb|rpm)$')

    - name: Install agent deb packages
      ansible.builtin.apt:
        deb: "/tmp/monitoring-packages/{{ item.artifact_file }}"
        policy_rc_d: 101
      loop: "{{ agent_components }}"
      when:
        - item.enabled | bool
        - ansible_os_family == 'Debian'
        - item.artifact_file | lower | regex_search('\\.deb$')
      notify: Restart agent services

    - name: Install agent rpm packages
      ansible.builtin.dnf:
        name: "/tmp/monitoring-packages/{{ item.artifact_file }}"
        state: present
        disable_gpg_check: "{{ monitoring_rpm_disable_gpg_check | default(true) | bool }}"
      loop: "{{ agent_components }}"
      when:
        - item.enabled | bool
        - ansible_os_family == 'RedHat'
        - item.artifact_file | lower | regex_search('\\.rpm$')
      notify: Restart agent services

    - name: Write agent configs
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../configs/{{ item.config_template }}"
        dest: "{{ agent_config_dir }}/{{ item.config_file }}"
        owner: "{{ observability_user }}"
        group: "{{ observability_group }}"
        mode: "0644"
      loop: "{{ agent_components }}"
      when: item.enabled | bool
      notify: Restart agent services

    - name: Install agent systemd units
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../configs/agent-component.service.j2"
        dest: "/etc/systemd/system/{{ item.name }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ agent_components }}"
      when: item.enabled | bool
      notify: Restart agent services

    - name: Enable and start agent services
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: "{{ agent_components }}"
      when: item.enabled | bool

  handlers:
    - name: Restart agent services
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        state: restarted
        daemon_reload: true
      loop: "{{ agent_components }}"
      when: item.enabled | bool
