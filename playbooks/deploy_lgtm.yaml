---
- name: Deploy monitoring stack
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  vars_files:
    - "../vars/common_{{ env | default('dev') }}.yaml"
  vars:
    lgtm_components:
      - name: grafana
        enabled: "{{ (monitoring_components_enabled | default({})).grafana | default(true) | bool }}"
        description: Grafana
        artifact_file: "{{ (monitoring_component_files | default({})).grafana | default('grafana.deb') }}"
        binary_dest: grafana-server
        binary_exec_path: "{{ lgtm_install_dir }}/bin/grafana-server"
        deb_exec_path: /usr/share/grafana/bin/grafana
        config_file: grafana.ini
        config_template: grafana.ini.j2
        data_dir: "{{ lgtm_data_dir }}/grafana"
        service_args: "--config={{ lgtm_config_dir }}/grafana.ini --homepath={{ grafana_home_dir }}"
        deb_service_args: "server --config={{ lgtm_config_dir }}/grafana.ini --homepath=/usr/share/grafana"

      - name: loki
        enabled: "{{ (monitoring_components_enabled | default({})).loki | default(true) | bool }}"
        description: Loki
        artifact_file: "{{ (monitoring_component_files | default({})).loki | default('loki') }}"
        binary_dest: loki
        binary_exec_path: "{{ lgtm_install_dir }}/bin/loki"
        deb_exec_path: /usr/bin/loki
        config_file: loki.yaml
        config_template: loki.yaml.j2
        data_dir: "{{ lgtm_data_dir }}/loki"
        service_args: "-config.file={{ lgtm_config_dir }}/loki.yaml"

      - name: tempo
        enabled: "{{ (monitoring_components_enabled | default({})).tempo | default(true) | bool }}"
        description: Tempo
        artifact_file: "{{ (monitoring_component_files | default({})).tempo | default('tempo.deb') }}"
        binary_dest: tempo
        binary_exec_path: "{{ lgtm_install_dir }}/bin/tempo"
        deb_exec_path: /usr/bin/tempo
        config_file: tempo.yaml
        config_template: tempo.yaml.j2
        data_dir: "{{ lgtm_data_dir }}/tempo"
        service_args: "-config.file={{ lgtm_config_dir }}/tempo.yaml"

      - name: prometheus
        enabled: "{{ (monitoring_components_enabled | default({})).prometheus | default(true) | bool }}"
        description: Prometheus
        artifact_file: "{{ (monitoring_component_files | default({})).prometheus | default('prometheus') }}"
        binary_dest: prometheus
        binary_exec_path: "{{ lgtm_install_dir }}/bin/prometheus"
        deb_exec_path: /usr/bin/prometheus
        config_file: prometheus.yaml
        config_template: prometheus.yaml.j2
        data_dir: "{{ lgtm_data_dir }}/prometheus"
        service_args: >-
          --config.file={{ lgtm_config_dir }}/prometheus.yaml
          --storage.tsdb.path={{ lgtm_data_dir }}/prometheus
          --web.listen-address={{ lgtm_bind_address }}:{{ prometheus_http_port }}
          --web.enable-remote-write-receiver

  tasks:
    - name: Ensure observability group exists
      ansible.builtin.group:
        name: "{{ observability_group }}"
        system: true

    - name: Ensure observability user exists
      ansible.builtin.user:
        name: "{{ observability_user }}"
        group: "{{ observability_group }}"
        create_home: false
        shell: /usr/sbin/nologin
        system: true

    - name: Create monitoring base directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ observability_user }}"
        group: "{{ observability_group }}"
        mode: "0755"
      loop:
        - "{{ lgtm_install_dir }}"
        - "{{ lgtm_install_dir }}/bin"
        - "{{ lgtm_config_dir }}"
        - "{{ lgtm_data_dir }}"

    - name: Create Grafana provisioning directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ observability_user }}"
        group: "{{ observability_group }}"
        mode: "0755"
      loop:
        - "{{ lgtm_config_dir }}/grafana"
        - "{{ lgtm_config_dir }}/grafana/provisioning"
        - "{{ lgtm_config_dir }}/grafana/provisioning/datasources"
      when: (monitoring_components_enabled | default({})).grafana | default(true) | bool

    - name: Create Grafana home directory
      ansible.builtin.file:
        path: "{{ grafana_home_dir }}"
        state: directory
        owner: "{{ observability_user }}"
        group: "{{ observability_group }}"
        mode: "0755"
      when:
        - (monitoring_components_enabled | default({})).grafana | default(true) | bool
        - not ((monitoring_component_files | default({})).grafana | default('grafana.deb') | lower | regex_search('\\.deb$'))

    - name: Provision Grafana datasources
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../configs/grafana-datasources.yaml.j2"
        dest: "{{ lgtm_config_dir }}/grafana/provisioning/datasources/monitoring.yaml"
        owner: "{{ observability_user }}"
        group: "{{ observability_group }}"
        mode: "0644"
      when: (monitoring_components_enabled | default({})).grafana | default(true) | bool
      notify: Restart monitoring services

    - name: Create monitoring component data directories
      ansible.builtin.file:
        path: "{{ item.data_dir }}"
        state: directory
        owner: "{{ observability_user }}"
        group: "{{ observability_group }}"
        mode: "0755"
      loop: "{{ lgtm_components }}"
      when: item.enabled | bool

    - name: Create monitoring package cache directory
      ansible.builtin.file:
        path: /tmp/monitoring-packages
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install monitoring binary artifacts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/bin/{{ item.artifact_file }}"
        dest: "{{ lgtm_install_dir }}/bin/{{ item.binary_dest }}"
        owner: root
        group: root
        mode: "0755"
      loop: "{{ lgtm_components }}"
      when:
        - item.enabled | bool
        - not (item.artifact_file | lower | regex_search('\\.deb$'))
      notify: Restart monitoring services

    - name: Stage monitoring deb artifacts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/deb/{{ item.artifact_file }}"
        dest: "/tmp/monitoring-packages/{{ item.artifact_file }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ lgtm_components }}"
      when:
        - item.enabled | bool
        - item.artifact_file | lower | regex_search('\\.deb$')

    - name: Install monitoring deb packages
      ansible.builtin.apt:
        deb: "/tmp/monitoring-packages/{{ item.artifact_file }}"
        policy_rc_d: 101
      loop: "{{ lgtm_components }}"
      when:
        - item.enabled | bool
        - item.artifact_file | lower | regex_search('\\.deb$')
      notify: Restart monitoring services

    - name: Write monitoring configs
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../configs/{{ item.config_template }}"
        dest: "{{ lgtm_config_dir }}/{{ item.config_file }}"
        owner: "{{ observability_user }}"
        group: "{{ observability_group }}"
        mode: "0644"
      loop: "{{ lgtm_components }}"
      when: item.enabled | bool
      notify: Restart monitoring services

    - name: Install monitoring systemd units
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../configs/monitoring-component.service.j2"
        dest: "/etc/systemd/system/{{ item.name }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ lgtm_components }}"
      when: item.enabled | bool
      notify: Restart monitoring services

    - name: Enable and start monitoring services
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: "{{ lgtm_components }}"
      when: item.enabled | bool

  handlers:
    - name: Restart monitoring services
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        state: restarted
        daemon_reload: true
      loop: "{{ lgtm_components }}"
      when: item.enabled | bool
